# Relais de notifications API -> bot
# Le bot reste hors du réseau internal et sans port publié : ce relais, présent
# sur les deux réseaux, ne laisse passer que POST /notify vers bot:3001.

server {
    listen 80;
    server_name localhost;

    location = /notify {
        limit_except POST { deny all; }

        # Résolution dynamique : le relais démarre même si le bot est absent.
        resolver 127.0.0.11 valid=10s;
        set $bot_upstream http://bot:3001;

        proxy_pass $bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La clé X-Api-Key / Authorization est transmise telle quelle au bot.
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        client_max_body_size 64k;
    }

    # Tout le reste est refusé
    location / {
        return 404;
    }
}
